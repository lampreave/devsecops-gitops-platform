name: Reusable Helm & GitOps Validation

on:
  workflow_call:
    inputs:
      chart_path:
        description: "Path to Helm chart directory"
        required: false
        default: "charts/demo-service"
        type: string
      gitops_path:
        description: "Path to ArgoCD GitOps manifests"
        required: false
        default: "gitops"
        type: string

jobs:
  validate-helm-and-gitops:
    name: Helm Lint, Kubeconform & Trivy Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.1.0

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Lint Helm chart (dev & prod values)
        run: |
          helm lint "${{ inputs.chart_path }}" -f "${{ inputs.chart_path }}/values-dev.yaml"
          helm lint "${{ inputs.chart_path }}" -f "${{ inputs.chart_path }}/values-prod.yaml"

      - name: Render and schema-validate Kubernetes manifests
        run: |
          mkdir -p /tmp/rendered
          helm template demo-dev "${{ inputs.chart_path }}" -n demo-dev -f "${{ inputs.chart_path }}/values-dev.yaml" > /tmp/rendered/dev.yaml
          helm template demo-prod "${{ inputs.chart_path }}" -n demo-prod -f "${{ inputs.chart_path }}/values-prod.yaml" > /tmp/rendered/prod.yaml
          kubeconform -strict -ignore-missing-schemas -summary /tmp/rendered/dev.yaml /tmp/rendered/prod.yaml

      - name: Validate ArgoCD GitOps YAML syntax
        run: |
          python3 -c '
          import glob, yaml
          files = glob.glob("${{ inputs.gitops_path }}/**/*.yaml", recursive=True)
          assert files, "No GitOps YAML files found"
          for f in files:
              docs = list(yaml.safe_load_all(open(f)))
              assert any(d for d in docs), f"Empty YAML: {f}"
              print("OK:", f)
          '

      - name: Scan rendered manifests with Trivy (Security-as-Code)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: /tmp/rendered
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
