name: Reusable DevSecOps CI

on:
  workflow_call:
    inputs:
      image_name:
        description: "Container image name (e.g. ghcr.io/owner/repo/demo-service)"
        required: true
        type: string
      dockerfile_path:
        description: "Path to Dockerfile"
        required: false
        default: "app/Dockerfile"
        type: string
      context_path:
        description: "Docker build context path"
        required: false
        default: "app"
        type: string
      block_on_vulnerabilities:
        description: "Fail build when fixable HIGH/CRITICAL CVEs are detected"
        required: false
        default: true
        type: boolean
      push_image:
        description: "Push signed/verified container image to GHCR"
        required: false
        default: false
        type: boolean

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret detection
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo:ro" \
            zricethezav/gitleaks:v8.21.2 \
            detect --source=/repo --verbose --redact

  test-and-lint:
    name: Python Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install -r app/requirements-dev.txt

      - name: Run Ruff static analysis
        run: ruff check app

      - name: Run pytest suite
        env:
          PYTHONPATH: app
        run: pytest -v app/tests

  container-security-and-build:
    name: Build, SBOM & Trivy Security Gate
    runs-on: ubuntu-latest
    needs: [secret-scan, test-and-lint]
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ inputs.dockerfile_path }}
          config: .hadolint.yaml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build container image locally for scanning
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ inputs.context_path }}
          file: ${{ inputs.dockerfile_path }}
          load: true
          tags: ${{ inputs.image_name }}:ci-${{ github.sha }}

      - name: Generate CycloneDX SBOM (Syft)
        uses: anchore/sbom-action@v0.24.4
        with:
          image: ${{ inputs.image_name }}:ci-${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom-cyclonedx.json
          upload-artifact: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom-cyclonedx.json
          retention-days: 14

      - name: Run Trivy image vulnerability gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.image_name }}:ci-${{ github.sha }}
          format: table
          exit-code: ${{ inputs.block_on_vulnerabilities && '1' || '0' }}
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.push_image }}
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified image to GHCR
        if: ${{ inputs.push_image }}
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ inputs.context_path }}
          file: ${{ inputs.dockerfile_path }}
          push: true
          tags: |
            ${{ inputs.image_name }}:${{ github.sha }}
            ${{ inputs.image_name }}:latest
