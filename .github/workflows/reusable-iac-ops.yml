name: Reusable IaC & Ansible Security Validation

on:
  workflow_call:

jobs:
  terraform-validate-and-scan:
    name: Terraform Validate & Trivy IaC Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.9.8"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate Terraform environments
        run: |
          for env_dir in infra/terraform/envs/dev infra/terraform/envs/prod; do
            echo "=== Validating ${env_dir} ==="
            (cd "${env_dir}" && terraform init -backend=false -input=false && terraform validate)
          done

      - name: Run Trivy IaC security scan on Terraform
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

  ansible-lint:
    name: Ansible Playbook Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-lint
        run: pip install ansible-lint

      - name: Lint Linux hardening playbook
        working-directory: infra/ansible
        run: ansible-lint linux-hardening.yml
